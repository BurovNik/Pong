name: CI

on:
  push:
    branches: [ "master", "develop", 'burov_branch', 'slava_luchiy' ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GCC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install GCC (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make

      - name: Build game
        run: make game
        # Для Windows make из msys2 будет доступен как make
        shell: bash

      - name: Run tests
        run: make test
        shell: bash

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pong-linux
          path: |
            pong
            run_tests

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pong-windows
          path: |
            pong.exe
            run_tests.exe